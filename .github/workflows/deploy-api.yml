name: Deploy API till Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:          # gör att du kan köra den manuellt från Actions-fliken

env:
  AZURE_WEBAPP_NAME: vibecheck-api
  API_PROJECT: backend/VibeCheck.Api/VibeCheck.Api.csproj
  DOTNET_VERSION: '10.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Sökvägen pekas ut explicit. Repot har ingen .sln i roten, så dotnet
      # vet annars inte vilket projekt som ska byggas.
      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT }} -c Release -o ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build                # deploy startar först när build blivit grön
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
